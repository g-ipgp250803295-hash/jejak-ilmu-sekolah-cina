<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEJAK ILMU — Sekolah Vernakular Cina</title><style>*{box-sizing:border-box}body{margin:0;background:#f3ebdd;color:#24344d;font-family:Georgia,serif}.museum{max-width:1200px;margin:auto;min-height:0;aspect-ratio:16/9;background:radial-gradient(ellipse at center,#fff8ec,#f3ebdd);display:flex;flex-direction:column;border:3px solid #a58a62;overflow:auto;justify-content:center}.head{background:linear-gradient(120deg,#633943,#884f59,#633943);text-align:center;color:#fff3df;padding:23px 15px}.head small{letter-spacing:3px;color:#e7cda2}.head h1{font-size:clamp(24px,3.6vw,43px);margin:9px 0}.sub{font-size:13px;color:#f4dcca}.intro{text-align:center;padding:12px 12px 7px;color:#884f59}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:10px 22px}.card{background:#fffaf1;border:2px solid #c9ae86;border-radius:14px;box-shadow:0 5px 0 #d7c2a3;padding:16px 10px;min-height:150px;text-align:center;cursor:pointer;color:#24344d;font:inherit;transition:transform .2s,background .2s}.card:hover,.card:focus{transform:translateY(-4px);background:#fff2dd;outline:2px solid #884f59}.card .emoji{font-size:37px;display:block;margin-bottom:9px}.card strong{font-size:17px;display:block}.card .short{font-size:13px;color:#884f59;margin-top:9px;display:block}.card .hint{font-size:11px;margin-top:9px;display:block;color:#756d62}.detail{margin:13px 22px;padding:15px 22px;background:#fffaf3;border:1px dashed #a58a62;border-radius:12px;min-height:105px;position:relative}.detail h2{font-size:20px;color:#884f59;margin:0 0 7px}.detail p{margin:0;line-height:1.55;font-size:15px}.foot{background:#24344d;color:#fff5e4;padding:14px 22px;margin-top:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}.foot p{font-size:13px;margin:5px 0}.foot button,.actions button{background:#a58a62;color:#fff;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer}.foot button:hover,.actions button:hover{background:#884f59}.actions{display:flex;gap:8px;align-items:center}.status{font-size:13px;color:#884f59}#quiz{display:none;margin:13px 22px;padding:15px;background:#fffaf3;border:1px solid #a58a62;border-radius:12px}#quiz h2{font-size:19px;margin:0 0 10px}#quiz button{margin:4px;padding:9px 13px;border:1px solid #a58a62;background:#f3ebdd;color:#24344d;border-radius:8px;cursor:pointer}#quiz button:hover{background:#e9d4b4}@media(max-width:680px){.museum{aspect-ratio:auto;min-height:650px}.cards{grid-template-columns:repeat(2,1fr);padding:8px;gap:9px}.card{min-height:130px;padding:10px 6px}.card .emoji{font-size:27px}.card strong{font-size:14px}.detail,#quiz{margin:10px}.foot{flex-direction:column;align-items:start}.head h1{font-size:25px}}</style></head><body><main class="museum"><div class="intro">Pilih satu kad dan terokai ciri-ciri sekolah Cina pada zaman British.</div><section class="cards" aria-label="Kad nota interaktif"><button class="card" onclick="reveal(0)"><span class="emoji">📖</span><strong>BAHASA</strong><span class="short">Bahasa Cina</span><span class="hint">✦ Klik untuk teroka</span></button><button class="card" onclick="reveal(1)"><span class="emoji">🗺️</span><strong>LOKASI</strong><span class="short">Bandar & komuniti Cina</span><span class="hint">✦ Klik untuk teroka</span></button><button class="card" onclick="reveal(2)"><span class="emoji">🏛️</span><strong>PENGELOLA</strong><span class="short">Persatuan & masyarakat Cina</span><span class="hint">✦ Klik untuk teroka</span></button><button class="card" onclick="reveal(3)"><span class="emoji">✏️</span><strong>FOKUS</strong><span class="short">Akademik, bahasa & budaya</span><span class="hint">✦ Klik untuk teroka</span></button></section><section class="detail" aria-live="polite"><h2 id="dt">📜 NOTA KURATOR</h2><p id="dp">Klik mana-mana kad di atas untuk membaca penerangan ringkas. Teroka keempat-empat kad untuk mengenali ciri-ciri sekolah Cina.</p><div class="status" id="progress" style="margin-top:8px">Kad diterokai: 0/4</div></section></main><script>
const notes=[
['📖 BAHASA','Bahasa Cina digunakan sebagai bahasa pengantar. Pembelajaran turut membantu murid mengenali bahasa dan warisan budaya komuniti Cina.'],
['🗺️ LOKASI','Sekolah Cina berkembang di bandar dan kawasan penempatan komuniti Cina, selaras dengan keperluan pendidikan masyarakat setempat.'],
['🏛️ PENGELOLA','Banyak sekolah Cina ditubuhkan serta disokong oleh persatuan dan masyarakat Cina melalui sumbangan komuniti.'],
['✏️ FOKUS','Pembelajaran memberi tumpuan kepada mata pelajaran akademik, penguasaan bahasa serta pemeliharaan budaya dan identiti masyarakat.']
];
let seen=new Set(),ctx;
function beep(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.12)}catch(e){}}
function reveal(i){beep();document.getElementById('dt').textContent=notes[i][0];document.getElementById('dp').textContent=notes[i][1];seen.add(i);document.getElementById('progress').textContent='Kad diterokai: '+seen.size+'/4'+(seen.size===4?' · Tahniah! Semua nota telah dibuka.':'')}
</script></body></html>
